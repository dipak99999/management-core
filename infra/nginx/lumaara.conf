# nginx reverse proxy for Lumaara. Deploy at /etc/nginx/sites-available/lumaara
# then `ln -s` into sites-enabled + `nginx -t && systemctl reload nginx`.
#
# Assumes TLS termination via Let's Encrypt (certbot --nginx). For a
# self-signed / uploaded cert, swap the ssl_certificate paths and drop the
# ACME challenge block.
#
# Topology this expects:
#   - shell     on 127.0.0.1:3000 → served at https://erp.example.com/
#   - portal-web on 127.0.0.1:3007 → served at https://portal.example.com/
#   - backend services on 127.0.0.1:4001-4009 → all under /api/* on the shell host

# ── Shared upstream definitions ─────────────────────────────────────────
upstream lumaara_shell        { server 127.0.0.1:3000; keepalive 32; }
upstream lumaara_portal       { server 127.0.0.1:3007; keepalive 32; }
upstream lumaara_accounting_web { server 127.0.0.1:3001; keepalive 32; }
upstream lumaara_buying_web     { server 127.0.0.1:3002; keepalive 32; }
upstream lumaara_stock_web      { server 127.0.0.1:3003; keepalive 32; }
upstream lumaara_crm_web        { server 127.0.0.1:3004; keepalive 32; }
upstream lumaara_hr_web         { server 127.0.0.1:3005; keepalive 32; }
upstream lumaara_projects_web   { server 127.0.0.1:3006; keepalive 32; }

upstream lumaara_auth        { server 127.0.0.1:4001; keepalive 32; }
upstream lumaara_accounting  { server 127.0.0.1:4002; keepalive 32; }
upstream lumaara_stock       { server 127.0.0.1:4003; keepalive 32; }
upstream lumaara_crm         { server 127.0.0.1:4004; keepalive 32; }
upstream lumaara_hr          { server 127.0.0.1:4005; keepalive 32; }
upstream lumaara_projects    { server 127.0.0.1:4006; keepalive 32; }

# ── Staff-facing (shell + backends) ─────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.example.com;  # ← REPLACE

    ssl_certificate     /etc/letsencrypt/live/erp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Body size: xlsx imports base64-encoded can hit ~6MB. Cap at 10MB to
    # match packages/db/src/xlsx.ts MAX_XLSX_BYTES ceiling.
    client_max_body_size 10M;

    # Security headers — services also set these but belt-and-braces at the
    # edge means a misconfigured downstream still gets a safe response.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Backend API routing ────────────────────────────────────────────
    # Every backend gets a /api/<service-name>/ prefix, stripped before
    # forwarding. Client apps hit https://erp.example.com/api/accounting/customers.
    location /api/auth/       { rewrite ^/api/auth/(.*)$       /$1 break; proxy_pass http://lumaara_auth;       include proxy-common.conf; }
    location /api/accounting/ { rewrite ^/api/accounting/(.*)$ /$1 break; proxy_pass http://lumaara_accounting; include proxy-common.conf; }
    location /api/stock/      { rewrite ^/api/stock/(.*)$      /$1 break; proxy_pass http://lumaara_stock;      include proxy-common.conf; }
    location /api/crm/        { rewrite ^/api/crm/(.*)$        /$1 break; proxy_pass http://lumaara_crm;        include proxy-common.conf; }
    location /api/hr/         { rewrite ^/api/hr/(.*)$         /$1 break; proxy_pass http://lumaara_hr;         include proxy-common.conf; }
    location /api/projects/   { rewrite ^/api/projects/(.*)$   /$1 break; proxy_pass http://lumaara_projects;   include proxy-common.conf; }

    # ── Frontend routing (shell + module remotes) ──────────────────────
    # Shell owns / and rewrites /accounting/*, /crm/*, etc. to the module
    # remotes via its next.config.js. We only need to route / to shell here.
    location / {
        proxy_pass http://lumaara_shell;
        include proxy-common.conf;
    }
}

# ── Customer-facing portal ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.example.com;  # ← REPLACE

    ssl_certificate     /etc/letsencrypt/live/portal.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Portal needs to hit /api/accounting/ for orders + invoices. Same
    # upstream as staff — perms enforce which endpoints portal users see.
    location /api/accounting/ { rewrite ^/api/accounting/(.*)$ /$1 break; proxy_pass http://lumaara_accounting; include proxy-common.conf; }

    location / {
        proxy_pass http://lumaara_portal;
        include proxy-common.conf;
    }
}

# ── HTTP → HTTPS redirect ───────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name erp.example.com portal.example.com;

    # Certbot leaves this uncommented after `certbot --nginx`; needed for
    # ACME renewal challenges.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}
