# Included by every location{} block in lumaara.conf. Keeps the proxy
# semantics identical for every upstream — one edit rippling everywhere
# beats copy-paste drift.

proxy_http_version 1.1;

# Forward useful headers to the app. Host lets Next.js compute canonical
# URLs; X-Forwarded-For + Real-IP let audit-log capture the client IP.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Preserve Connection: upgrade for websocket / SSE (mcp-server uses SSE).
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Timeouts: default 60s is fine for CRUD. Long-running reports (analytics-plus)
# can hit 120s; agent tool dispatch was capped at 30s in code. Match the
# larger of the two.
proxy_connect_timeout 10s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;

# Buffer sizing for the mixed-content responses (JSON + occasional PDF).
proxy_buffer_size     16k;
proxy_buffers         8 16k;
proxy_busy_buffers_size 32k;
