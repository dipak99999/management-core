global:
  scrape_interval: 15s

# Alert rules — see alerts.yaml for the full ruleset (service-down, error
# rate, latency, DB pool, scheduler). Wire an Alertmanager separately to
# route firing alerts to Slack/PagerDuty.
rule_files:
  - alerts.yaml

scrape_configs:
  # Scrape the metrics the OTel collector re-exports on :8889
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Scrape /metrics on each Lumaara service — mountBasicOps exposes it
  - job_name: lumaara-services
    metrics_path: /metrics
    static_configs:
      - targets:
        - auth-service:4001
        - accounting-service:4002
        - stock-service:4003
        - crm-service:4004
        - hr-service:4005
        - projects-service:4006
        - scheduler:4009
        - mcp-server:4110

  # Scheduler-only secondary scrape — per-job consecutive-failure gauge
  # + run counter. The generic /metrics scrape above only shows the http_*
  # counters; this path adds scheduler_consecutive_failures{job=...} that
  # LumaaraSchedulerJobStuck in alerts.yaml fires on.
  - job_name: lumaara-scheduler-detail
    metrics_path: /metrics-scheduler
    static_configs:
      - targets:
        - scheduler:4009
