# Journald retention drop-in for Lumaara services. Installed to
# /etc/systemd/journald.conf.d/lumaara.conf so it survives package upgrades
# (the main journald.conf may be overwritten by distro updates).
#
# Retention posture: 30 days OR 4 GB, whichever hits first. Sized for a
# medium-tenant workload with structured JSON logging at INFO. Adjust
# SystemMaxUse upward if you keep debug logs on long-running incidents.

[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=4G
SystemKeepFree=1G
MaxRetentionSec=30day
MaxFileSec=1day
ForwardToSyslog=no
